# OpenOCD for riscvCpu with Debug Enable on a Sipeed Tang Nano 20K, through the board's USB-JTAG (its BL616,
# which looks like an FT2232): openocd -f tangnano20k.cfg, then gdb: target extended-remote :3334
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0x000b
adapter speed 6000
transport select jtag
jtag newtap gw2a tap -irlen 8 -expected-id 0x0000081b
target create gw2a.cpu riscv -chain-position gw2a.tap
riscv set_ir dtmcs 0x42
riscv set_ir dmi 0x43
# when gdb detaches, the CPU goes on (OpenOCD leaves it as gdb left it, otherwise)
gw2a.cpu configure -event gdb-detach { if {[gw2a.cpu curstate] eq "halted"} { resume } }
# 3334: Logisim's own GDB server (Debug Enable, in the simulation) has 3333 while the circuit is open
gdb_port 3334

# The BL616 takes interface A's FTDI latency timer for the board's serial port too, and OpenOCD has just set it to
# 255 ms, which holds back the console's short output: back to 1 ms.
init
if {[catch {exec python3 [file dirname [info script]]/bl616_latency.py 1 1} r]} { echo "Warn : $r" } else { echo "Info : $r" }
